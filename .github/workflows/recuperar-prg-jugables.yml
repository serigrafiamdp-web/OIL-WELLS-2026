name: Recuperar PRG jugables Oil's Well
on:
  push:
    paths:
      - .github/workflows/recuperar-prg-jugables.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recuperar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer y verificar pruebas jugables
        shell: bash
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          from hashlib import sha256

          zip_path = Path("archivos/OIL_WELLS_2026_REPOSITORIO_COMPLETO.zip")
          expected = {
              "OILS_WELL_TEST01_TECLADO_WASD_SPACE.prg": "effbffa3146218d26615ee318da0b1ea667e102b5d52f05eaf3cfa4627f4bbd0",
              "OILS_WELL_TEST02_WASD_AUTO_RETRACCION.prg": "10fa3a4e16670516352fbef6c8b06aba3b483f3cb486ffcad1abc1d406ed7122",
              "OILS_WELL_TEST03_W_FIRE_SAD_MOVIMIENTO.prg": "10d771c17498342a975d4fca2d706a6ed77a5c956b5d00db650a27d0aa568269",
          }
          with ZipFile(zip_path) as archive:
              for file_name, checksum in expected.items():
                  raw = archive.read("prg/controles/" + file_name)
                  actual = sha256(raw).hexdigest()
                  if actual != checksum or len(raw) != 38405:
                      raise RuntimeError(f"PRG incorrecto: {file_name}, sha256={actual}")
                  dest = Path("PRG/jugables") / file_name
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(raw)
                  print(f"VERIFICADO {dest} sha256={actual}")
              # Conservar recursos originales aún ausentes de los archivos individuales
              for name in archive.namelist():
                  if not name.startswith(("mapas/", "charset/", "colores/", "previews/")):
                      continue
                  if name.endswith("/"):
                      continue
                  dest = Path(name)
                  if not dest.exists():
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(archive.read(name))

          for old in Path("PRG/visores_estaticos").glob("*.prg"):
              old.unlink()
          # El ZIP histórico permanece disponible en el historial de Git; no dejar
          # PRG estáticos ocultos en el árbol actual.
          zip_path.unlink()
          print("Solo tres PRG jugables presentes en la versión actual")
          PY
      - name: Guardar PRG y recursos sin visores estáticos
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: conservar solo PRG jugables TEST01-03; retirar visores estáticos"
          git push
